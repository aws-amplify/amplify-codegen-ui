name: Release

on:
  push:
    branches: [main, 'tagged-release/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report which package versions would be published from package.json'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Commit Message
        run: git log --format=%s -n 1 | npx --no-install commitlint
      - name: Build
        run: npm run build
      - name: Unit Test
        run: npm run test:ci
      # Only the dist output of the published packages is needed to publish.
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            packages/codegen-ui/dist
            packages/codegen-ui-react/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    # id-token is granted only to this job, which runs no package install or build scripts:
    # dependencies are installed with --ignore-scripts and the build output comes from the build job.
    permissions:
      contents: write # push release tags and create GitHub Releases
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lerna needs the full history and tags to compute versions and find tagged releases
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm -v)"; then
            npm install -g npm@^11.5.1
          fi
          npm -v
      - name: Install packages
        run: npm ci --ignore-scripts
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # On a release commit the script tags HEAD (and pushes the tag) before `lerna publish from-git`,
      # because from-git only publishes versions tagged on HEAD and the squash-merged commit is untagged.
      # Other commits on main and tagged-release/* publish a prerelease; manual runs use from-package.
      - name: Publish
        run: ./.github/scripts/publish.sh
        env:
          PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && 'from-package' || 'push' }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          # Fallback token for publishing until trusted publishing is verified; remove it afterwards.
          # lerna exchanges the GitHub OIDC token for a publish token and uses this one only if that fails.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
